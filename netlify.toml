[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 7 needs Node 22.12+.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# v1 URLs → v2 (Work + Experience merged; Writing became Field notes).
[[redirects]]
  from = "/work/*"
  to = "/experience/:splat"
  status = 301

[[redirects]]
  from = "/writing/*"
  to = "/notes/:splat"
  status = 301

# The AI's content index: public anyway, but keep it out of search results.
[[headers]]
  for = "/api/knowledge.json"
  [headers.values]
    X-Robots-Tag = "noindex"

# Hashed build assets never change.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
